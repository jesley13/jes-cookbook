backend:
  name: github
  repo: your-username/your-repo-name # IMPORTANT: Replace with your actual repo!
  branch: main # Branch to update
  use_pkce: true # No server required for GitHub OAuth

local_backend: true

media_folder: "public/images/recipes" # Media files will be stored in the repo under public/images/recipes
public_folder: "/images/recipes" # The src attribute for uploaded media will begin with /images/recipes

collections:
  - name: "recipes" # Used in routes, e.g., /admin/collections/recipes
    label: "Recipe" # Used in the UI
    folder: "recipes" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template
    fields: # The fields for each document, usually in front matter
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Cuisine", name: "cuisine", widget: "string"}
      - {label: "Protein", name: "protein", widget: "string", required: false}
      - {label: "Servings", name: "servings", widget: "number"}
      - {label: "Prep Time (minutes)", name: "prep_time", widget: "number", required: false}
      - {label: "Cook Time (minutes)", name: "cook_time", widget: "number", required: false}
      - {label: "Total Time (minutes)", name: "total_time", widget: "number", required: false}
      - {label: "Difficulty", name: "difficulty", widget: "select", options: ["Easy", "Medium", "Difficult"]}
      - {label: "Cooking Methods", name: "cooking_methods", widget: "list", required: false}
      - {label: "Equipment", name: "equipment", widget: "list", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Favourite", name: "favourite", widget: "boolean", default: false, required: false}
      - {label: "Made Before", name: "made_before", widget: "boolean", default: false, required: false}
      - {label: "Would Make Again", name: "would_make_again", widget: "boolean", default: true, required: false}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Source (URL or Book)", name: "source", widget: "string", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
