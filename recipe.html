      <a href="/jes-cookbook/" style="color: var(--text-primary); text-decoration: none; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 50%; display: flex;">

          <line x1="19" y1="12" x2="5" y2="12"></line>

    <main>

      </div>

      <div class="recipe-content">

        <div id="recipe-body">
          <!-- Markdown body injected here -->
        </div>

      </div>
