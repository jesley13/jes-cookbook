<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Recipe - Jes' cookbook</title>
  <link rel="stylesheet" href="./style.css" />
  <script>
    if (localStorage.getItem('theme') === 'light' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.add('light-mode');
    }
  </script>
</head>
<body>
  <div class="container" style="padding: 0;">
    <header style="padding: 16px; border-bottom: none; display: flex; align-items: center; gap: 16px; position: absolute; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; width: 100%; justify-content: space-between; z-index: 10;">
      <a href="/jes-cookbook/" style="color: var(--text-primary); text-decoration: none; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 50%; display: flex; backdrop-filter: blur(4px);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <button id="theme-toggle" class="theme-toggle-btn" style="position: static;" aria-label="Toggle light/dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </header>

    <main>
      <div id="recipe-header" class="recipe-header-content">
        <h1 id="recipe-title" class="recipe-title">Loading...</h1>
      </div>

      <div class="recipe-content">

        <div id="recipe-body">
          <!-- Markdown body injected here -->
        </div>

      </div>
    </main>
  </div>
  
  <script type="module" src="/recipe.js"></script>
</body>
</html>
