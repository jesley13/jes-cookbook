<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Recipe - Jes' cookbook</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container" style="padding: 0;">
    <header style="padding: 16px; border-bottom: none; display: flex; align-items: center; gap: 16px; position: absolute; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;">
      <a href="./" style="color: var(--text-primary); text-decoration: none; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 50%; display: flex;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
    </header>

    <main>
      <div id="recipe-img-container">
        <!-- Image injected here -->
      </div>
      
      <div class="recipe-header-content">
        <h1 id="recipe-title" class="recipe-title">Loading...</h1>
        <div class="card-meta" id="recipe-meta" style="font-size: 0.875rem;">
          <!-- Meta (Rating, Fav, Difficulty, Category) -->
        </div>
        
        <div class="recipe-quick-info">
          <div class="quick-info-box">
            <div class="quick-info-label">Prep</div>
            <div class="quick-info-value" id="info-prep">-</div>
          </div>
          <div class="quick-info-box">
            <div class="quick-info-label">Cook</div>
            <div class="quick-info-value" id="info-cook">-</div>
          </div>
          <div class="quick-info-box">
            <div class="quick-info-label">Total</div>
            <div class="quick-info-value" id="info-total">-</div>
          </div>
        </div>
      </div>

      <div class="recipe-content">
        <div class="scaler-container" style="margin-top: 24px;">
          <span style="font-weight: 600; color: var(--text-secondary);">Serves:</span>
          <button id="scale-down" class="scaler-btn">-</button>
          <span id="servings-value" class="scaler-value">4</span>
          <button id="scale-up" class="scaler-btn">+</button>
        </div>

        <div id="recipe-body">
          <!-- Markdown body injected here -->
        </div>

        <a id="edit-btn" href="#" class="edit-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 8px;">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          Edit Recipe in CMS
        </a>
      </div>
    </main>
  </div>
  
  <script type="module" src="/recipe.js"></script>
</body>
</html>
