name: Issue to Recipe
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  create-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Recipe File
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';
            const fs = require('fs');
            
            // Clean up the title to make a valid filename
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            
            // Check if title was edited and remove the old file
            if (context.payload.action === 'edited' && context.payload.changes && context.payload.changes.title) {
              const oldTitle = context.payload.changes.title.from;
              const oldSlug = oldTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
              if (oldSlug !== slug && fs.existsSync(`recipes/${oldSlug}.md`)) {
                fs.unlinkSync(`recipes/${oldSlug}.md`);
              }
            }
            
            // Create the content with the required dashed frontmatter
            const content = `---\ntitle: ${title}\n---\n\n${body}`;
            
            // Save it to the recipes folder
            if (!fs.existsSync('recipes')) {
              fs.mkdirSync('recipes');
            }
            fs.writeFileSync(`recipes/${slug}.md`, content);
            
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A recipes/
          git commit -m "Update recipe: ${{ github.event.issue.title }}" || echo "No changes to commit"
          git push
          
      - name: Close Issue and Add Comment
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.action === 'opened') {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ I have automatically converted this into a recipe and added it to your cookbook! It will appear on the website in about 60 seconds.'
              });
              github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            } else if (context.payload.action === 'edited') {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '🔄 I have updated the recipe with your latest edits! It will appear on the website shortly.'
              });
            }
