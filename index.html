<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jes' cookbook</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">
        <a href="/jes-cookbook/">Jes' cookbook</a>
        <a href="/jes-cookbook/admin/" style="font-size: 0.875rem; font-weight: 500; color: var(--accent-color); display: none;" class="desktop-admin-link">Admin</a>
      </div>
      <div class="search-container">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search recipes, ingredients..." />
      </div>
      
    </header>

    <main>
      <div id="recipe-grid" class="recipe-grid">
        <!-- Recipe cards injected here via JS -->
      </div>
      <div id="no-results" class="hidden">
        <p>No recipes found matching your criteria.</p>
        <button class="chip" id="clear-filters-btn" style="margin-top: 12px;">Clear Filters & Search</button>
      </div>
    </main>
  </div>

    <nav class="bottom-nav">
    <a href="/jes-cookbook/" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Home
    </a>
    <a href="#" id="nav-favs" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      Favourites
    </a>
    <a href="/jes-cookbook/admin/" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      Admin
    </a>
  </nav>

  <script type="module" src="/main.js"></script>
</body>
</html>
